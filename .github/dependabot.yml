version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # uv_build in [build-system] must stay on the same minor as required-version
      # in pyproject.toml, which Dependabot can't see. Upgrading uv is manual: see
      # DEVELOPMENT.md.
      - dependency-name: uv-build
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  # Base images in the Dockerfile. They're pinned by digest; Dependabot updates the
  # digest when the publisher rebuilds a tag (e.g. security patches) and the tag
  # for patch releases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new Python minor must change both FROM lines at once: the virtualenv the
      # build stage makes points at its own python3.X, which the runtime must have.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The uv tag must stay within required-version in pyproject.toml, which
      # Dependabot can't see. Upgrading uv is manual: see DEVELOPMENT.md.
      - dependency-name: ghcr.io/astral-sh/uv
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      # One group for both images, so their digest updates land in the same PR and
      # the build and runtime stages stay on the same Python patch release.
      base-images:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  # The Postgres image in compose.yaml, pinned by digest. Dependabot updates the
  # digest within major version 18; a new major needs a dump and restore (see
  # "Backups" in DEVELOPMENT.md), so it's left to a person.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Betterleaks v2 drops the --staged and --log-opts flags that
      # scripts/check_secrets.py uses and changes fingerprints, so upgrading
      # to it is manual.
      - dependency-name: "*betterleaks*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
