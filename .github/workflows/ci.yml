name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Fail instead of silently updating uv.lock when it is out of date.
  UV_LOCKED: "1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Betterleaks
        # Match the pinned release in .pre-commit-config.yaml.
        env:
          BETTERLEAKS_VERSION: 1.10.0
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="checksums.txt"
          release="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$release/$checksums" -o "$checksums"
          awk -v archive="$archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' "$checksums" > selected-checksum.txt
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "$archive" betterleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan full history for secrets
        run: |
          python3 tests/secrets_smoke.py
          python3 scripts/check_secrets.py history

  check:
    runs-on: ubuntu-latest
    # A normal run takes under a minute; stop a hung one well before GitHub's 6-hour default.
    timeout-minutes: 15
    env:
      # Throwaway passwords for the Postgres this job starts and then discards.
      POSTGRES_PASSWORD: ci-admin-password # betterleaks:allow
      GROUNDLINE_DB_PASSWORD: ci-app-password # betterleaks:allow
      DATABASE_ADMIN_URL: postgresql+psycopg://postgres:ci-admin-password@localhost:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make setup
      - run: make check
      # The database tests, including the migration-drift check, against the
      # same Postgres image and health check as compose.yaml.
      - run: make test-db

  docker:
    # Build the image, then start the Compose stack and smoke-test it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: groundline:dev
          # Load the image into the runner's Docker so the smoke test can run it.
          load: true
          cache-from: type=gha
          # mode=max also caches the build stage, which holds the dependency layer.
          cache-to: type=gha,mode=max
      - run: scripts/docker-smoke-test

  https:
    # Local test CA only. AWS acceptance remains a separate manual check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect HTTPS inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -E '^(infra/https/|compose[^/]*\.yaml$|tests/https_smoke\.py$|scripts/https-smoke-test$|scripts/https_check\.py$|Dockerfile$|Makefile$|\.github/workflows/ci\.yml$)' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.changes.outputs.run == 'true'
      - run: make https-smoke
        if: steps.changes.outputs.run == 'true'

  terraform:
    # The Terraform for AWS test deployments (infra/): formatting, validation and
    # its tests, which plan against a mock AWS provider. No AWS credentials, so
    # nothing is created.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17"
          terraform_wrapper: false
      - run: make infra-check

  dependency-review:
    # Block PRs that add a dependency with a known high or critical vulnerability.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
