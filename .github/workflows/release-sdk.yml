name: Release SDK

# Publish groundline-client: build it once, upload it to TestPyPI, install it from
# there and check it, then, after a reviewer approves, upload the same files to
# PyPI and tag the release. Only someone starting it by hand runs it. From a
# branch other than main it stops after TestPyPI, with a development version.
# DEVELOPMENT.md, "Releasing", explains how to run it.

on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, and never one canceled halfway. Per branch, so
# a release from main waiting for approval doesn't hold up a trial elsewhere.
# GitHub keeps only one run waiting per group: a newer run cancels a waiting one.
concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fail instead of silently updating uv.lock when it is out of date.
  UV_LOCKED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, so the version check can see earlier releases.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Build and check from a clean slate: other workflows write the shared cache.
          enable-cache: false
      - name: Choose the version
        id: version
        # Standard library only, so no project environment to sync first.
        run: uv run --quiet --no-project python scripts/release_version.py groundline-client >> "$GITHUB_OUTPUT"
      - name: Use a development version for a run from a branch
        if: github.ref != 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Not --frozen: uv.lock must record the new version too, or the next uv
        # run stops under UV_LOCKED. The lock change stays on this runner.
        run: env -u UV_LOCKED uv version --package groundline-client --no-sync "$VERSION"
      - name: Build
        run: uv build --package groundline-client --out-dir dist
      - name: Check the built files
        run: scripts/sdk-install-check --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/groundline-client/${{ needs.build.outputs.version }}/
    permissions:
      # Trusted publishing: a short-lived token instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  verify:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Build and check from a clean slate: other workflows write the shared cache.
          enable-cache: false
      - name: Wait for TestPyPI to list the upload
        # A new upload can take a minute or two to appear in the index.
        run: |
          # Both files' exact names, so an earlier development version can't
          # match, and the wheel the next step downloads is surely there.
          for attempt in $(seq 20); do
            if page="$(curl --silent --fail --max-time 30 "https://test.pypi.org/simple/groundline-client/")" &&
              grep --quiet --fixed-strings "groundline_client-$VERSION.tar.gz" <<< "$page" &&
              grep --quiet --fixed-strings "groundline_client-$VERSION-py3-none-any.whl" <<< "$page"; then
              exit 0
            fi
            echo "waiting for groundline-client $VERSION on TestPyPI ($attempt)"
            sleep 15
          done
          echo "groundline-client $VERSION didn't appear on TestPyPI within 5 minutes"
          exit 1
      - name: Install from TestPyPI and check it
        run: scripts/sdk-install-check --from-index https://test.pypi.org/simple/ "$VERSION"

  pypi:
    needs: [build, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment's required reviewers approve before this job starts.
    environment:
      name: pypi
      url: https://pypi.org/project/groundline-client/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      # The files checked from TestPyPI, not a new build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # If an upload stopped partway, "Re-run failed jobs" uploads the rest
          # of these same files. A new run can't reach here: the version check
          # refuses a version that is already on PyPI.
          skip-existing: true

  release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To create the tag and the GitHub release.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Tag the release and publish its notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # A pre-release must not become "Latest". Only true or false is accepted,
          # so a missing value stops the job instead of publishing it as final.
          # A final release's notes start from the previous final release, so
          # they cover everything since then, not just what followed an rc.
          case "$PRERELEASE" in
            true) options=(--prerelease); lookup=(--exclude-drafts) ;;
            false) options=(); lookup=(--exclude-drafts --exclude-pre-releases) ;;
            *) echo "prerelease is '$PRERELEASE', not true or false"; exit 1 ;;
          esac
          # Notes from the previous groundline-client release, not from whatever the
          # repository released last (the library releases here too). No pipe, so a
          # failed lookup fails the step.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 "${lookup[@]}" \
            --json tagName --jq '[.[].tagName | select(startswith("groundline-client-v"))][0] // empty')"
          if [ -n "$previous" ]; then
            options+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "groundline-client $VERSION" \
            --generate-notes \
            --latest=false \
            "${options[@]}"
