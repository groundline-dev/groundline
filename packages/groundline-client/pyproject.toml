[project]
name = "groundline-client"
version = "0.1.0"
description = "Python SDK for the groundline API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Shannon Mulloy", email = "smulloy21@gmail.com" },
    { name = "Avinash Darshan", email = "avidars2@gmail.com" },
    { name = "Nathalia Gibson", email = "natgibson@gmail.com" },
    { name = "Deborah (YY) Chang", email = "yydchang@gmail.com" },
]
requires-python = ">=3.13"
# Only what the generated code imports, so the SDK can sit in another app
# without the pipelines, the Anthropic SDK or the server (ADR 0018).
dependencies = [
    "attrs>=22.2.0",
    "httpx2>=2.13.1,<3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# The generator is pinned exactly, and uv.lock pins what it installs, because
# its output depends on both (ADR 0018). Upgrading it means a PR that also
# regenerates the code.
dev = [
    "openapi-python-client==0.30.0",
]

# The hand-written code and the tests are strict. The generated code is
# checked at the basic level: strict reports 22 type-inference gaps inside the
# generator's own output (ADR 0018).
[tool.pyright]
include = ["src", "tests"]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
strict = ["src/groundline_client/__init__.py", "tests"]
