# Opt-in HTTPS for EC2. The host sets GROUNDLINE_PUBLIC_IP before startup.
# COMPOSE_FILE=compose.yaml:compose.https.yaml keeps later Compose commands on
# the same stack. Requires Compose 2.24.4+ for !reset (AWS installs a pinned version).
services:
  app:
    ports: !reset []
  postgres:
    ports: !reset []
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    ports:
      - "443:443"
    volumes:
      # Rendered by infra/https/refresh-address before Docker starts. Mount the
      # directory so atomic file replacement is visible after a restart.
      - ./infra/https/runtime:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
