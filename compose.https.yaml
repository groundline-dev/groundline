# Opt-in HTTPS for EC2. The host sets GROUNDLINE_PUBLIC_IP before startup.
# COMPOSE_FILE=compose.yaml:compose.https.yaml keeps later Compose commands on
# the same stack. Requires Compose 2.24.4+ for !reset (AWS installs a pinned version).
services:
  app:
    ports: !reset []
  postgres:
    ports: !reset []
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    environment:
      GROUNDLINE_PUBLIC_IP: ${GROUNDLINE_PUBLIC_IP:?the host must discover its public IPv4 address first}
    ports:
      - "443:443"
    volumes:
      - ./infra/https/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
