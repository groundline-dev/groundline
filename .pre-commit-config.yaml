repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all]
        exclude: ^uv\.lock$

  - repo: https://github.com/betterleaks/betterleaks
    rev: 8d77e1712fb06fd14444cc648686f1d5655e28a8 # v1.10.0; match the secrets CI job
    hooks:
      - id: betterleaks
        name: Check staged files for secrets
        entry: python3 scripts/check_secrets.py staged
        stages: [pre-commit]
        always_run: true
      - id: betterleaks
        alias: secrets-tracked
        name: Check tracked files for secrets
        entry: python3 scripts/check_secrets.py tracked
        stages: [manual]
        always_run: true

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (run make fix)
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (run make fix)
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
