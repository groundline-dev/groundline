[project]
name = "groundline-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Shannon Mulloy", email = "smulloy21@gmail.com" },
    { name = "Avinash Darshan", email = "avidars2@gmail.com" },
    { name = "Nathalia Gibson", email = "natgibson@gmail.com" },
    { name = "Deborah (YY) Chang", email = "yydchang@gmail.com" },
]
requires-python = ">=3.13"
# Only what the pipelines need, so the library can sit inside another app
# without bringing a web server, database tools or a CLI framework with it.
dependencies = [
    "anthropic>=2.3.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
]

# Both extras need the database: the API checks API keys against it, and the
# command manages them. tests/test_packaging.py checks these lists.
[project.optional-dependencies]
server = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.7",
    "sqlalchemy[asyncio]>=2.1.6",
]
cli = [
    "alembic>=1.20.1",
    "platformdirs>=4.14.3",
    "psycopg[binary]>=3.3.7",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
groundline-core = "groundline_core.command:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# The dev group, which uv sync installs by default, pulls in both extras, so a
# plain `uv sync` still sets up everything for development.
dev = [
    "groundline-core[server,cli]",
    "pre-commit>=4.7.0",
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261030",
    "openapi-spec-validator>=0.9.0",
]

[tool.uv]
# The uv versions allowed for local development, CI (setup-uv reads this setting)
# and the Dockerfile's build image. Pinned to one minor so all three resolve, lock
# and build the same way: a new uv minor can change how it resolves or writes uv.lock.
required-version = ">=0.13.7,<0.14"

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, and import sorting.
select = ["E", "W", "F", "I"]

[tool.fastapi]
entrypoint = "groundline_core.app:app"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
markers = [
    "live: calls the real model API and costs money (run with: pytest -m live)",
    "db: needs a local PostgreSQL 18 (run with: pytest -m db)",
]
addopts = "-m 'not live and not db'"
