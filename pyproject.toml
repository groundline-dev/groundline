[project]
name = "groundline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shannon Mulloy", email = "smulloy21@gmail.com" },
    { name = "Avinash Darshan", email = "avidars2@gmail.com" },
    { name = "Nathalia Gibson", email = "natgibson@gmail.com" },
    { name = "Deborah (YY) Chang", email = "yydchang@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, and import sorting.
select = ["E", "W", "F", "I"]

[tool.fastapi]
entrypoint = "groundline.app:app"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
